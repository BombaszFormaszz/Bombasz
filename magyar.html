<style>
    /* AMOLED (Pure Black) téma beállításai */
    :root { 
        --p: #000000;          /* Fejléc is fekete */
        --a: #00eeff;          /* Marad a cián kiemelés, jól mutat a feketén */
        --bg: #000000;         /* Tiszta fekete háttér */
        --card-bg: #000000;    /* Kártyák is feketék legyenek */
        --text: #ffffff;       /* Hófehér szöveg a maximális kontrasztért */
        --select-border: #333; /* Finom szürke keret az elemeknek */
    }

    body { 
        font-family: 'Segoe UI', sans-serif; 
        line-height: 1.6; 
        margin: 0; 
        background: var(--bg); 
        color: var(--text); 
    }

    header { 
        background: var(--bg); 
        color: white; 
        text-align: center; 
        padding: 1rem; 
        position: sticky; 
        top: 0; 
        z-index: 1000; 
        /* Egy vékony alsó vonal választja el a fejlécet, mivel minden fekete */
        border-bottom: 1px solid #222; 
    }

    .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
    
    select { 
        width: 100%; 
        padding: 15px; 
        border-radius: 8px; 
        border: 2px solid var(--select-border); 
        font-size: 1rem; 
        margin-bottom: 20px; 
        outline: none; 
        background: #000000; /* Legördülő háttér is fekete */
        color: white; 
    }
    
    #content-area { 
        background: var(--card-bg); 
        padding: 25px; 
        border-radius: 12px; 
        /* Erősebb keret a kártyának, hogy elváljon a háttértől */
        border: 1px solid #222;
        display: none; 
    }
    
    h2 { color: #fff; border-bottom: 3px solid var(--a); padding-bottom: 8px; margin-top: 0; }
    
    .formatted-text { white-space: pre-wrap; font-size: 1.1rem; word-wrap: break-word; }

    /* Képek AMOLED módhoz */
    .embedded-img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 20px auto;
        border-radius: 6px;
        border: 1px solid #333;
        /* Kicsit sötétítve, hogy ne "égesse" a szemet a fekete háttéren */
        filter: brightness(0.7); 
        transition: filter 0.3s;
    }

    .embedded-img:hover {
        filter: brightness(1); 
    }

    /* Görgetősáv (Scrollbar) AMOLED stílusban */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--a); }

    @media (max-width: 600px) { .formatted-text { font-size: 1rem; } }
</style>
</head>

szerelmük beteljesülésének lehetetlensége miatt többször megkísérelték a szakítást. 1912-ben
szakítottak végleg. Léda kezdetben ezt is csak egy veszekedésnek gondolta, majd a Nyugatból értesült

Elbocsátó, szép üzenet (1912)
Címe: ellentétes a tartalommal
Téma: a szakítás, a Léda - szerelem lezárása
Hangnem: nyegle, dölyfös, pocskondiázó hang, nyilvánvalóan bántó szándék
Szerkezet:
1. vsz.:
- az első sor utal rá, hogy ez már egy szakítássorozat lezárása
- feltűnik az előző versekben is megjelenő harc: kezdetben egyenlőtlen küzdelem - Léda volt az
erősebb, később egyenrangú felek voltak (Héja-nász az avaron), most viszont Ady az erősebb
- a költő bosszút áll az egykori megaláztatásokért
- a harc lezárása, az ellenfél teljes megsemmisítése a célja
- az „sz” hangok azt sugallják: közelről sziszegi Léda szemébe a gúnyos szavakat
- felsőbbrendűség tudata: krőzusság, szabadságvágy, függetlenség, önimádat szavak jellemzik a költőt
- túlzás, jelző, halmozás, ismétlés, anafora (sor eleji szóismétlés) → költői eszközök a nő
megalázására: kicsiny, rab, rég hervadt virág, önállótlanság, nemlétezés, leigázottság
2. vsz.:
- szerelmüket visszamenőleg megfosztja minden értékétől
- a szakítást véglegességet jelzi a régen többszöri ismétlése
- a Léda-versek már csak ámítások voltak
- unott régi csók: Léda
-„Ám köszönök…” – mintha valóban köszönni akarna, de az utolsó sor visszadöccen a gúnyba
3. vsz.:
- csak azért tartott a szerelem, hogy Léda legyen valaki általa
- saját túlcsorduló értékeit aggatta rá Ady Lédára
4.-5. vsz.:
- Léda („kis kérdőjel”) Ady által lett valakivé
- Léda teljesen megsemmisítése
- szép hullást akar, mert Lédán már rajta van az ő zsenijének nyoma, de ettől is megfosztja: zörög –
szerelmük megtagadása
- a kegyetlen ítéletet, önimádást az váltotta ki, hogy a szerelem nem hozta meg a teljességet
Összegzés:
- Ady igazságtalan
- de kellett a kegyetlenségnek ez a foka ahhoz, hogy végleg lezárhassa a terhessé vált kapcsolatot

- kapcsolatukban fontos szerepet kapott a testiség

Csinszka - szerelem
Ady 1911 óta levelezett Boncza Bertával (Csinszka). 1915-ben házasodtak össze. Ady
számára a szerelem menedék volt a bajokkal (háború, betegség) és az állandó támadásokkal
szemben.
A versek jellemzői a köznapi hangvétel, az egyszerűség, a szépség és az idill megőrzése. Nem
igazán szerelmes versek, Csinszka a háttérben marad.
