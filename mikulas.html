<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mikulás futtató</title>
    <style>
        body{
    /* background-image: url(img/hatter.jpg); */
    background-color: rgb(30, 255, 0);
    background-size: cover;

}
    </style>
</head>
<body>
    <script>
(function() {
    if (sessionStorage.getItem('bombasz_returning') !== 'true') return;

    // Gomb létrehozása
    const backBtn = document.createElement('button');
    backBtn.id = 'bombasz-back-btn';
    backBtn.innerHTML = '<i class="fa-solid fa-arrow-left"></i> VISSZA';
    
    // Stílus
    backBtn.style.cssText = `
        position: fixed; top: 20px; left: 20px;
        padding: 12px 28px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: white; font-family: sans-serif; font-weight: bold; text-transform: uppercase;
        border-radius: 30px; cursor: pointer; z-index: 9999;
        opacity: 0; transform: translateY(-20px);
        transition: all 0.3s ease;
        backdrop-filter: blur(5px);
    `;

    // Gomb események
    backBtn.onmouseenter = () => { backBtn.style.transform = 'translateY(-20px) scale(1.1)'; };
    backBtn.onmouseleave = () => { backBtn.style.transform = 'translateY(-20px) scale(1)'; };

    // KATTINTÁS - ITT TÖRTÉNIK A ZOOM
    backBtn.onclick = (e) => {
        e.preventDefault();
        
        // Adatok mentése
        sessionStorage.setItem('bombasz_returning', 'true');
        sessionStorage.setItem('bombasz_level', '1');
        sessionStorage.setItem('bombasz_category', '0');

        // 1. Fehér villanás réteg (kezdetben láthatatlan)
        const overlay = document.createElement('div');
        overlay.style.cssText = `
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #ffffff; opacity: 0; z-index: 999999; pointer-events: none;
            transition: opacity 0.5s ease-in; /* Lassan fehéredik */
        `;
        document.body.appendChild(overlay);

        // 2. A BODY beállítása a nagyításhoz
        document.body.style.transformOrigin = 'center center';
        document.body.style.transition = 'transform 0.6s cubic-bezier(0.7, 0, 0.3, 1)';
        document.body.style.overflow = 'hidden'; // Hogy ne jelenjen meg görgetősáv nagyításkor

        requestAnimationFrame(() => {
            // ZOOM START: Az oldal 8x akkorára nő!
            document.body.style.transform = 'scale(8)'; 
            
            // Közben kifehéredik
            overlay.style.opacity = '1';

            // Váltás
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        });
    };

    document.body.appendChild(backBtn);
    setTimeout(() => { backBtn.style.opacity = '1'; backBtn.style.transform = 'translateY(0)'; }, 200);
})();
</script>

    <script>
        function createsanta(event){
            let santa = document.createElement("img");
            santa.src = "img/santahood.gif";
            santa.style.width = "600px";
            santa.style.height = "250px";
            santa.style.position = "absolute";
            santa.style.top = event.clientY-125 + "px";
            santa.style.left = event.clientX-100 + "px";
            document.body.appendChild(santa);
        
            setInterval(() => {
                santa.style.left = parseInt(santa.style.left) + 5 + "px";
                if(parseInt(santa.style.left)===document.body.clientWidth){
                    document.removeChild(santa);
                }
            }, 125);
        }
        
        document.addEventListener("click", createsanta);
