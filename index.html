<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BombaszFormaszz</title>
    <script type="module" src="auth.js"></script>
    <script src="user-ui.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="hero-canvas"></canvas>

    <header class="header">
        <div class="logo">BOMBASZ</div>
        <div class="header-right" id="auth-section">
            <span class="header-auth">CONNECTING...</span>
        </div>
    </header>

    <!-- Hero címsor -->
    <div class="hero-overlay" id="hero-overlay">

        <div class="scroll-hint">

            <i class="fa-solid fa-chevron-down"></i>

    <!-- Óra -->
    <div class="clock-display" id="clock-display">
        <span id="real-time-clock"></span>
    </div>

    <!-- Kattintható linkek konténere (CSS2DRenderer helyett HTML overlay) -->
    <div id="labels-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
