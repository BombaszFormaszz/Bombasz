<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fájl Megosztás • BOMBASZ</title>

    <script type="module" src="auth.js"></script>
    <script src="user-ui.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.ico">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #000; --text: #fff; --gray: #888; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        body.has-user-bar { padding-top: 44px !important; }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        .page-header { position: relative; z-index: 10; text-align: center; padding: 80px 20px 10px; }
        .page-header h1 { font-family: 'Orbitron', sans-serif; font-size: clamp(22px, 5vw, 44px); font-weight: 900; letter-spacing: 0.12em; opacity: 0; animation: slideUp 0.8s ease 0.3s forwards; }
        .page-header p { color: var(--gray); font-size: 13px; letter-spacing: 2px; margin-top: 8px; opacity: 0; animation: slideUp 0.8s ease 0.5s forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }

        /* ---- DROPZONE ---- */
        .upload-section {
            position: relative; z-index: 10;
            max-width: 700px; margin: 30px auto 0; padding: 0 20px;
            opacity: 0; animation: slideUp 0.8s ease 0.6s forwards;
        }

        .dropzone {
            border: 2px dashed rgba(255,255,255,0.12);
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .dropzone:hover, .dropzone.dragover {
            border-color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.03);
        }
        .dropzone-icon { font-size: 36px; opacity: 0.25; margin-bottom: 14px; }
        .dropzone-text { font-size: 14px; color: var(--gray); margin-bottom: 6px; }
        .dropzone-hint { font-size: 11px; color: rgba(255,255,255,0.25); }

        .dropzone input[type="file"] {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        /* ---- PROGRESS ---- */
        .upload-progress {
            display: none;
            margin-top: 14px;
            padding: 16px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .upload-progress.visible { display: block; animation: slideUp 0.3s ease; }

        .progress-filename {
            font-size: 13px; font-weight: 600;
            margin-bottom: 8px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .progress-bar-wrap {
            height: 4px;
            background: rgba(255,255,255,0.06);
            overflow: hidden;
            margin-bottom: 6px;
        }
        .progress-bar-fill {
            height: 100%; width: 0%;
            background: var(--text);
            transition: width 0.2s ease;
        }
        .progress-text { font-size: 11px; color: var(--gray); }

        /* ---- SHARE BOX ---- */
        .share-box {
            display: none; margin-top: 14px;
            padding: 16px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .share-box.visible { display: block; animation: slideUp 0.3s ease; }

        .share-label { font-size: 10px; letter-spacing: 2px; color: var(--gray); text-transform: uppercase; margin-bottom: 6px; }

        .share-link-row { display: flex; gap: 8px; }

        .share-link {
            flex: 1; padding: 10px 12px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12);
            color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 11px;
            outline: none; cursor: text;
        }

        .share-expire { font-size: 11px; color: var(--gray); margin-top: 8px; }
        .share-expire i { color: #ffe66d; }

        .btn-main {
            font-family: 'Orbitron', sans-serif; font-size: 9px; font-weight: 700;
            letter-spacing: 2px; padding: 10px 18px;
            border: 1px solid var(--text); background: transparent; color: var(--text);
            cursor: pointer; transition: all 0.3s ease; white-space: nowrap;
        }
        .btn-main:hover { background: var(--text); color: var(--bg); }

        /* ---- FILE LIST ---- */
        .files-section {
            position: relative; z-index: 10;
            max-width: 700px; margin: 40px auto 0; padding: 0 20px 100px;
        }

        .section-label {
            font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700;
            letter-spacing: 3px; color: var(--gray); margin-bottom: 12px;
            display: flex; align-items: center; gap: 10px;
        }
        .section-label::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06); }

        .file-item {
            display: flex; align-items: center; gap: 12px;
            padding: 14px;
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 6px; transition: all 0.2s;
        }
        .file-item:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.12); }

        .file-icon {
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            font-size: 16px; color: var(--gray); flex-shrink: 0;
        }

        .file-info { flex: 1; min-width: 0; }
        .file-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-meta { font-size: 11px; color: var(--gray); margin-top: 2px; }

        .file-timer {
            font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700;
            color: var(--gray); white-space: nowrap; letter-spacing: 1px;
            flex-shrink: 0;
        }
        .file-timer.urgent { color: #ff6b6b; }

        .file-actions { display: flex; gap: 4px; flex-shrink: 0; }

        .file-btn {
            width: 32px; height: 32px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            color: var(--gray); font-size: 12px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s; text-decoration: none;
        }
        .file-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); border-color: rgba(255,255,255,0.2); }
        .file-btn.delete:hover { color: #ff4444; border-color: rgba(255,68,68,0.3); }

        .files-empty { text-align: center; padding: 40px 20px; color: var(--gray); font-size: 13px; }

        @media (max-width: 768px) {
            .page-header { padding: 60px 16px 10px; }
            .upload-section, .files-section { padding-left: 12px; padding-right: 12px; }
            .dropzone { padding: 35px 16px; }
            .file-timer { font-size: 9px; }
            .share-link-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <script src="transition-entry.js"></script>
    <canvas id="bg-canvas"></canvas>

    <div class="page-header">
        <h1>FÁJL MEGOSZTÁS</h1>
        <p>FELTÖLTÉS & LETÖLTÉS — 24 ÓRA UTÁN TÖRLŐDIK</p>
    </div>

    <div class="upload-section">
        <div class="dropzone" id="dropzone">
            <div class="dropzone-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
            <div class="dropzone-text">Húzd ide a fájlt vagy kattints a tallózáshoz</div>
            <div class="dropzone-hint">Max. 5 MB • Automatikusan törlődik 24 óra után</div>
            <input type="file" id="file-input">
        </div>

        <div class="upload-progress" id="upload-progress">
            <div class="progress-filename" id="progress-filename">—</div>
            <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-bar"></div></div>
            <div class="progress-text" id="progress-text">Feltöltés...</div>
        </div>

        <div class="share-box" id="share-box">
            <div class="share-label">LETÖLTÉSI LINK</div>
            <div class="share-link-row">
                <input class="share-link" id="share-link" readonly>
                <button class="btn-main" id="btn-copy">MÁSOLÁS</button>
            </div>
            <div class="share-expire"><i class="fa-solid fa-clock"></i> A fájl 24 óra múlva automatikusan törlődik</div>
        </div>
    </div>

    <div class="files-section">
        <div class="section-label">AKTÍV FÁJLOK</div>
        <div id="file-list">
            <div class="files-empty" id="files-empty">
                <i class="fa-solid fa-folder-open" style="font-size:24px;opacity:0.3;display:block;margin-bottom:10px"></i>
                Nincsenek aktív fájlok.
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref as dbRef, push, onValue, remove, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const ADMIN_EMAILS = ["bartaadikonyv@gmail.com","balazs.hajdu00@gmail.com","hajdub@kkszki.hu","adam070702@gmail.com"];
    const MAX_SIZE = 5 * 1024 * 1024; // 5MB (RTDB limit)
    const EXPIRE_MS = 24 * 60 * 60 * 1000; // 24h

    const firebaseConfig = {
        apiKey: "AIzaSyAwRrAtHaNRh2DLwVkryA3wSf86h7aQCaI",
        authDomain: "konyv-93c63.firebaseapp.com",
        databaseURL: "https://konyv-93c63-default-rtdb.firebaseio.com",
        projectId: "konyv-93c63",
        storageBucket: "konyv-93c63.firebasestorage.app",
        messagingSenderId: "308577632498",
        appId: "1:308577632498:web:yourappid"
    };

    const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const filesRef = dbRef(db, 'shared_files');

    let currentUser = null;
    let isAdmin = false;

    onAuthStateChanged(auth, (user) => {
        currentUser = user;
        isAdmin = user ? ADMIN_EMAILS.includes(user.email.toLowerCase()) : false;
    });

    // ---- FILE ICON HELPER ----
    function fileIcon(name) {
        const ext = (name || '').split('.').pop().toLowerCase();
        const map = {
            pdf: 'fa-file-pdf', doc: 'fa-file-word', docx: 'fa-file-word',
            xls: 'fa-file-excel', xlsx: 'fa-file-excel', csv: 'fa-file-csv',
            ppt: 'fa-file-powerpoint', pptx: 'fa-file-powerpoint',
            zip: 'fa-file-zipper', rar: 'fa-file-zipper', '7z': 'fa-file-zipper',
            jpg: 'fa-file-image', jpeg: 'fa-file-image', png: 'fa-file-image',
            gif: 'fa-file-image', webp: 'fa-file-image', svg: 'fa-file-image',
            mp3: 'fa-file-audio', wav: 'fa-file-audio', flac: 'fa-file-audio', ogg: 'fa-file-audio',
            mp4: 'fa-file-video', mkv: 'fa-file-video', avi: 'fa-file-video', webm: 'fa-file-video',
            js: 'fa-file-code', py: 'fa-file-code', html: 'fa-file-code', css: 'fa-file-code',
            cs: 'fa-file-code', java: 'fa-file-code', cpp: 'fa-file-code', json: 'fa-file-code',
            txt: 'fa-file-lines', md: 'fa-file-lines',
            exe: 'fa-gear', msi: 'fa-gear',
        };
        return 'fa-solid ' + (map[ext] || 'fa-file');
    }

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function timeLeft(uploadedAt) {
        const remaining = (uploadedAt + EXPIRE_MS) - Date.now();
        if (remaining <= 0) return { text: 'LEJÁRT', urgent: true };
        const h = Math.floor(remaining / 3600000);
        const m = Math.floor((remaining % 3600000) / 60000);
        return { text: `${h}h ${String(m).padStart(2,'0')}m`, urgent: h < 2 };
    }

    function escHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

    // ---- DRAG & DROP ----
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');

    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => { dropzone.classList.remove('dragover'); });
    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length) uploadFile(fileInput.files[0]);
        fileInput.value = '';
    });

    // ---- UPLOAD (Base64 to RTDB) ----
    async function uploadFile(file) {
        if (!currentUser) { alert('Jelentkezz be a feltöltéshez!'); return; }
        if (file.size > MAX_SIZE) { alert('Túl nagy fájl! Maximum 5 MB.'); return; }

        const progressBox = document.getElementById('upload-progress');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const progressName = document.getElementById('progress-filename');
        const shareBox = document.getElementById('share-box');

        shareBox.classList.remove('visible');
        progressBox.classList.add('visible');
        progressName.textContent = file.name;
        progressBar.style.width = '0%';
        progressText.textContent = 'Fájl olvasása...';

        const timestamp = Date.now();

        // Read file as base64
        const reader = new FileReader();
        reader.onprogress = (e) => {
            if (e.lengthComputable) {
                const pct = (e.loaded / e.total) * 50;
                progressBar.style.width = pct + '%';
                progressText.textContent = `Olvasás... ${Math.round(pct * 2)}%`;
            }
        };
        reader.onerror = () => {
            progressText.textContent = 'Hiba a fájl olvasásakor!';
            progressBar.style.background = '#ff4444';
        };
        reader.onload = async () => {
            try {
                progressBar.style.width = '50%';
                progressText.textContent = 'Feltöltés...';

                const base64 = reader.result; // data:type;base64,...

                const entry = await push(filesRef, {
                    name: file.name,
                    size: file.size,
                    type: file.type || 'application/octet-stream',
                    data: base64,
                    uploadedBy: currentUser.uid,
                    uploadedByName: currentUser.displayName || currentUser.email.split('@')[0],
                    uploadedAt: timestamp
                });

                progressBar.style.width = '100%';
                progressText.textContent = 'Kész!';

                // Share link = this page with ?dl=ID
                const shareUrl = `${window.location.origin}${window.location.pathname}?dl=${entry.key}`;
                document.getElementById('share-link').value = shareUrl;
                shareBox.classList.add('visible');

                document.getElementById('btn-copy').onclick = () => {
                    navigator.clipboard.writeText(shareUrl);
                    document.getElementById('btn-copy').textContent = 'MÁSOLVA ✓';
                    setTimeout(() => document.getElementById('btn-copy').textContent = 'MÁSOLÁS', 1500);
                };
            } catch(e) {
                console.error('Upload error:', e);
                progressText.textContent = 'Hiba: ' + e.message;
                progressBar.style.background = '#ff4444';
            }
        };
        reader.readAsDataURL(file);
    }

    // ---- CLEANUP EXPIRED FILES ----
    async function cleanupExpired(data) {
        if (!data) return;
        const now = Date.now();
        for (const [id, item] of Object.entries(data)) {
            if (item.uploadedAt && (now - item.uploadedAt) > EXPIRE_MS) {
                try {
                    await remove(dbRef(db, 'shared_files/' + id));
                    console.log('Cleaned up expired file:', item.name);
                } catch(e) {
                    console.warn('Cleanup error:', e);
                }
            }
        }
    }

    // ---- DIRECT DOWNLOAD via ?dl=ID ----
    const dlParam = new URLSearchParams(window.location.search).get('dl');
    if (dlParam) {
        try {
            const snap = await get(child(dbRef(db), 'shared_files/' + dlParam));
            if (snap.exists()) {
                const f = snap.val();
                // Trigger download
                const a = document.createElement('a');
                a.href = f.data;
                a.download = f.name;
                document.body.appendChild(a);
                a.click();
                a.remove();
            } else {
                alert('Ez a f\u00e1jl m\u00e1r t\u00f6rl\u0151d\u00f6tt vagy nem l\u00e9tezik.');
            }
        } catch(e) {
            console.error('Download error:', e);
        }
    }

    // ---- FILE LIST ----
    const fileList = document.getElementById('file-list');
    const filesEmpty = document.getElementById('files-empty');

    onValue(filesRef, (snapshot) => {
        const data = snapshot.val();
        fileList.querySelectorAll('.file-item').forEach(el => el.remove());

        // Run cleanup
        cleanupExpired(data);

        if (!data) { filesEmpty.style.display = ''; return; }

        const items = Object.entries(data).map(([id, val]) => ({ id, ...val }));
        // Filter out expired (they'll be cleaned up)
        const active = items.filter(i => (Date.now() - i.uploadedAt) < EXPIRE_MS);

        if (active.length === 0) { filesEmpty.style.display = ''; return; }
        filesEmpty.style.display = 'none';

        // Sort newest first
        active.sort((a, b) => (b.uploadedAt || 0) - (a.uploadedAt || 0));

        active.forEach(item => {
            const el = document.createElement('div');
            el.className = 'file-item';

            const canDelete = currentUser && (currentUser.uid === item.uploadedBy || isAdmin);
            const timer = timeLeft(item.uploadedAt);

            el.innerHTML = `
                <div class="file-icon"><i class="${fileIcon(item.name)}"></i></div>
                <div class="file-info">
                    <div class="file-name">${escHtml(item.name)}</div>
                    <div class="file-meta">${formatSize(item.size)} • ${escHtml(item.uploadedByName || '?')}</div>
                </div>
                <div class="file-timer ${timer.urgent ? 'urgent' : ''}">${timer.text}</div>
                <div class="file-actions">
                    <a class="file-btn" href="${item.data}" download="${escHtml(item.name)}" title="Letöltés"><i class="fa-solid fa-download"></i></a>
                    ${canDelete ? `<button class="file-btn delete" data-id="${item.id}" title="Törlés"><i class="fa-solid fa-trash"></i></button>` : ''}
                </div>
            `;

            fileList.appendChild(el);
        });

        // Delete handlers
        fileList.querySelectorAll('.file-btn.delete').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (!confirm('Biztosan törlöd ezt a fájlt?')) return;
                try {
                    await remove(dbRef(db, 'shared_files/' + btn.dataset.id));
                } catch(e) {
                    alert('Törlési hiba: ' + e.message);
                }
            });
        });
    });

    // Update timers every minute
    setInterval(() => {
        document.querySelectorAll('.file-item').forEach(el => {
            // Re-render timer would need stored data, simpler to reload
        });
    }, 60000);

    // ---- PARTICLE BG ----
    (function() {
        const canvas = document.getElementById('bg-canvas');
        if (!canvas || typeof THREE === 'undefined') return;
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        const count = window.innerWidth < 768 ? 400 : 800;
        const pos = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) { pos[i*3]=(Math.random()-0.5)*30; pos[i*3+1]=(Math.random()-0.5)*30; pos[i*3+2]=(Math.random()-0.5)*30; }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const mat = new THREE.PointsMaterial({ color:0xffffff, size:0.02, transparent:true, opacity:0.35, blending:THREE.AdditiveBlending });
        const pts = new THREE.Points(geo, mat);
        scene.add(pts);
        let mx=0, my=0;
        document.addEventListener('mousemove', e => { mx=(e.clientX/window.innerWidth-0.5)*2; my=(e.clientY/window.innerHeight-0.5)*2; });
        function anim() { requestAnimationFrame(anim); pts.rotation.y+=0.0003; pts.rotation.x+=(my*0.05-pts.rotation.x)*0.01; pts.rotation.y+=(mx*0.05-pts.rotation.y)*0.01; renderer.render(scene,camera); }
        anim();
        window.addEventListener('resize', () => { camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); });
    })();
    </script>
</body>
</html>
