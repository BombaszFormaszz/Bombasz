<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Közös Playlist • BOMBASZ</title>

    <script type="module" src="auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.ico">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #000; --text: #fff; --gray: #888; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }


        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        .page-header { position: relative; z-index: 10; text-align: center; padding: 80px 20px 10px; }
        .page-header h1 { font-family: 'Orbitron', sans-serif; font-size: clamp(22px, 5vw, 44px); font-weight: 900; letter-spacing: 0.12em; opacity: 0; animation: slideUp 0.8s ease 0.3s forwards; }
        .page-header p { color: var(--gray); font-size: 13px; letter-spacing: 2px; margin-top: 8px; opacity: 0; animation: slideUp 0.8s ease 0.5s forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }

        /* ---- ADD BAR ---- */
        .add-bar { position: relative; z-index: 10; max-width: 700px; margin: 30px auto 0; padding: 0 20px; opacity: 0; animation: slideUp 0.8s ease 0.6s forwards; }

        .add-row { display: flex; gap: 8px; }

        .add-input {
            flex: 1; padding: 12px 14px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12);
            color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 14px;
            outline: none; transition: border-color 0.2s;
        }
        .add-input:focus { border-color: rgba(255,255,255,0.4); }
        .add-input::placeholder { color: rgba(255,255,255,0.2); }

        .btn-main {
            font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700;
            letter-spacing: 2px; padding: 12px 24px;
            border: 1px solid var(--text); background: transparent; color: var(--text);
            cursor: pointer; transition: all 0.3s ease; white-space: nowrap;
        }
        .btn-main:hover { background: var(--text); color: var(--bg); }

        .add-hint { font-size: 11px; color: var(--gray); margin-top: 6px; text-align: center; }

        /* ---- PLAYER ---- */
        .player-section {
            position: relative; z-index: 10;
            max-width: 700px; margin: 30px auto 0; padding: 0 20px;
            opacity: 0; animation: slideUp 0.8s ease 0.7s forwards;
        }

        .player-wrap {
            width: 100%; aspect-ratio: 16/9;
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        .player-wrap iframe { width: 100%; height: 100%; border: none; }

        .player-empty { color: var(--gray); font-size: 13px; letter-spacing: 1px; text-align: center; }

        .now-playing {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 0; margin-top: 8px;
        }

        .now-title { font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
        .now-user { font-size: 11px; color: var(--gray); }

        .player-controls { display: flex; gap: 6px; }

        .ctrl-btn {
            width: 36px; height: 36px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text); font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.25); }

        /* ---- TRACK LIST ---- */
        .track-list {
            position: relative; z-index: 10;
            max-width: 700px; margin: 20px auto 0; padding: 0 20px 100px;
        }

        .track-count {
            font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700;
            letter-spacing: 3px; color: var(--gray); margin-bottom: 12px;
            display: flex; align-items: center; gap: 10px;
        }
        .track-count::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06); }

        .track-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px;
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 6px; cursor: pointer;
            transition: all 0.2s;
        }
        .track-item:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); }
        .track-item.active { border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.06); }

        .track-num { font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; color: var(--gray); width: 24px; text-align: center; flex-shrink: 0; }
        .track-item.active .track-num { color: var(--text); }

        .track-thumb {
            width: 48px; height: 36px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0; overflow: hidden;
        }
        .track-thumb img { width: 100%; height: 100%; object-fit: cover; }

        .track-info { flex: 1; min-width: 0; }
        .track-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-meta { font-size: 11px; color: var(--gray); margin-top: 2px; }

        .track-delete {
            background: none; border: none; color: rgba(255,255,255,0.1);
            font-size: 12px; cursor: pointer; transition: color 0.2s; padding: 6px; flex-shrink: 0;
        }
        .track-delete:hover { color: #ff4444; }

        .track-empty { text-align: center; padding: 40px 20px; color: var(--gray); font-size: 13px; }

        @media (max-width: 768px) {
            .page-header { padding: 60px 16px 10px; }
            .add-bar, .player-section, .track-list { padding-left: 12px; padding-right: 12px; }
            .add-row { flex-direction: column; }
            .track-thumb { width: 40px; height: 30px; }
        }
    </style>
</head>
<body>
    <script src="transition-entry.js"></script>
    <canvas id="bg-canvas"></canvas>

    <div class="page-header">
        <h1>KÖZÖS PLAYLIST</h1>
        <p>MINDENKI HOZZÁADHAT ZENÉKET</p>
    </div>

    <div class="add-bar">
        <div class="add-row">
            <input class="add-input" id="url-input" placeholder="YouTube URL beillesztése...">
            <button class="btn-main" id="btn-add">HOZZÁADÁS</button>
        </div>
        <div class="add-hint">Támogatott: youtube.com és youtu.be linkek</div>
    </div>

    <div class="player-section">
        <div class="player-wrap" id="player-wrap">
            <div class="player-empty">Válassz egy számot a listából<br>vagy adj hozzá újat!</div>
        </div>
        <div class="now-playing" id="now-playing" style="display:none">
            <div>
                <div class="now-title" id="now-title">—</div>
                <div class="now-user" id="now-user">—</div>
            </div>
            <div class="player-controls">
                <button class="ctrl-btn" onclick="playPrev()" title="Előző"><i class="fa-solid fa-backward-step"></i></button>
                <button class="ctrl-btn" onclick="playNext()" title="Következő"><i class="fa-solid fa-forward-step"></i></button>
                <button class="ctrl-btn" id="btn-shuffle" onclick="toggleShuffle()" title="Keverés"><i class="fa-solid fa-shuffle"></i></button>
            </div>
        </div>
    </div>

    <div class="track-list" id="track-list">
        <div class="track-empty" id="track-empty">
            <i class="fa-solid fa-music" style="font-size:24px;opacity:0.3;display:block;margin-bottom:10px"></i>
            Még nincsenek zenék. Adj hozzá egyet!
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const ADMIN_EMAILS = ["bartaadikonyv@gmail.com","balazs.hajdu00@gmail.com","hajdub@kkszki.hu","adam070702@gmail.com"];

    const firebaseConfig = {
        apiKey: "AIzaSyAwRrAtHaNRh2DLwVkryA3wSf86h7aQCaI",
        authDomain: "konyv-93c63.firebaseapp.com",
        databaseURL: "https://konyv-93c63-default-rtdb.firebaseio.com",
        projectId: "konyv-93c63",
        storageBucket: "konyv-93c63.firebasestorage.app",
        messagingSenderId: "308577632498",
        appId: "1:308577632498:web:yourappid"
    };

    const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const plRef = ref(db, 'playlist');

    let currentUser = null;
    let isAdmin = false;
    let tracks = [];
    let currentIndex = -1;
    let shuffle = false;

    onAuthStateChanged(auth, (user) => {
        currentUser = user;
        isAdmin = user ? ADMIN_EMAILS.includes(user.email.toLowerCase()) : false;
    });

    // ---- YOUTUBE HELPERS ----
    function extractVideoId(url) {
        const patterns = [
            /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
            /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
        ];
        for (const p of patterns) {
            const m = url.match(p);
            if (m) return m[1];
        }
        return null;
    }

    function thumbUrl(videoId) {
        return `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
    }

    // ---- ADD TRACK ----
    const btnAdd = document.getElementById('btn-add');
    const urlInput = document.getElementById('url-input');

    if (btnAdd) btnAdd.addEventListener('click', addTrack);
    if (urlInput) urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTrack(); });

    async function addTrack() {
        if (!currentUser) { alert('Jelentkezz be zene hozzáadásához!'); return; }

        const url = urlInput.value.trim();
        const videoId = extractVideoId(url);
        if (!videoId) { alert('Érvénytelen YouTube URL!'); return; }

        // Fetch title via noembed (free, no API key needed)
        let title = 'Ismeretlen cím';
        try {
            const resp = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
            const data = await resp.json();
            if (data.title) title = data.title;
        } catch(e) { console.warn('Title fetch failed', e); }

        await push(plRef, {
            videoId,
            title,
            addedBy: currentUser.uid,
            addedByName: currentUser.displayName || currentUser.email.split('@')[0],
            addedAt: Date.now()
        });

        urlInput.value = '';
    }

    // ---- RENDER TRACKS ----
    const trackList = document.getElementById('track-list');
    const trackEmpty = document.getElementById('track-empty');

    onValue(plRef, (snapshot) => {
        const data = snapshot.val();
        trackList.querySelectorAll('.track-item, .track-count').forEach(el => el.remove());

        if (!data) {
            trackEmpty.style.display = '';
            tracks = [];
            return;
        }
        trackEmpty.style.display = 'none';

        tracks = Object.entries(data).map(([id, val]) => ({ id, ...val }));
        tracks.sort((a, b) => (a.addedAt || 0) - (b.addedAt || 0));

        // Count header
        const countEl = document.createElement('div');
        countEl.className = 'track-count';
        countEl.textContent = `${tracks.length} SZÁM`;
        trackList.insertBefore(countEl, trackEmpty);

        tracks.forEach((track, idx) => {
            const el = document.createElement('div');
            el.className = 'track-item' + (idx === currentIndex ? ' active' : '');

            const canDelete = currentUser && (currentUser.uid === track.addedBy || isAdmin);

            el.innerHTML = `
                <div class="track-num">${idx + 1}</div>
                <div class="track-thumb"><img src="${thumbUrl(track.videoId)}" alt="" loading="lazy"></div>
                <div class="track-info">
                    <div class="track-title">${escHtml(track.title)}</div>
                    <div class="track-meta">${escHtml(track.addedByName || '?')}</div>
                </div>
                ${canDelete ? `<button class="track-delete" data-id="${track.id}"><i class="fa-solid fa-xmark"></i></button>` : ''}
            `;

            el.addEventListener('click', (e) => {
                if (e.target.closest('.track-delete')) return;
                playTrack(idx);
            });

            trackList.appendChild(el);
        });

        // Delete handlers
        trackList.querySelectorAll('.track-delete').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (confirm('Törlöd ezt a számot?')) {
                    remove(ref(db, 'playlist/' + btn.dataset.id));
                }
            });
        });
    });

    // ---- PLAYER ----
    function playTrack(idx) {
        if (idx < 0 || idx >= tracks.length) return;
        currentIndex = idx;
        const track = tracks[idx];

        const wrap = document.getElementById('player-wrap');
        wrap.innerHTML = `<iframe src="https://www.youtube.com/embed/${track.videoId}?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;

        document.getElementById('now-title').textContent = track.title;
        document.getElementById('now-user').textContent = 'Hozzáadta: ' + (track.addedByName || '?');
        document.getElementById('now-playing').style.display = '';

        // Update active state
        trackList.querySelectorAll('.track-item').forEach((el, i) => {
            el.classList.toggle('active', i === idx);
        });
    }

    window.playNext = function() {
        if (tracks.length === 0) return;
        if (shuffle) {
            playTrack(Math.floor(Math.random() * tracks.length));
        } else {
            playTrack((currentIndex + 1) % tracks.length);
        }
    };

    window.playPrev = function() {
        if (tracks.length === 0) return;
        playTrack(currentIndex <= 0 ? tracks.length - 1 : currentIndex - 1);
    };

    window.toggleShuffle = function() {
        shuffle = !shuffle;
        document.getElementById('btn-shuffle').style.borderColor = shuffle ? 'var(--text)' : 'rgba(255,255,255,0.1)';
        document.getElementById('btn-shuffle').style.background = shuffle ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.04)';
    };

    function escHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

    // ---- PARTICLE BG ----
    (function() {
        const canvas = document.getElementById('bg-canvas');
        if (!canvas || typeof THREE === 'undefined') return;
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        const count = window.innerWidth < 768 ? 400 : 800;
        const pos = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) { pos[i*3]=(Math.random()-0.5)*30; pos[i*3+1]=(Math.random()-0.5)*30; pos[i*3+2]=(Math.random()-0.5)*30; }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const mat = new THREE.PointsMaterial({ color:0xffffff, size:0.02, transparent:true, opacity:0.35, blending:THREE.AdditiveBlending });
        const pts = new THREE.Points(geo, mat);
        scene.add(pts);
        let mx=0, my=0;
        document.addEventListener('mousemove', e => { mx=(e.clientX/window.innerWidth-0.5)*2; my=(e.clientY/window.innerHeight-0.5)*2; });
        function anim() { requestAnimationFrame(anim); pts.rotation.y+=0.0003; pts.rotation.x+=(my*0.05-pts.rotation.x)*0.01; pts.rotation.y+=(mx*0.05-pts.rotation.y)*0.01; renderer.render(scene,camera); }
        anim();
        window.addEventListener('resize', () => { camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); });
    })();
    </script>
</body>
</html>
